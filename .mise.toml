[tools]
dotnet = "10.0.401"
bats = "1.14.0"
jq = "1.8.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
zizmor = "1.30.1"
prek = "0.5.3"
act = "0.2.89"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

# CI runs exactly these tasks (.github/workflows/ci.yml), so a local run matches CI.

[tasks.lint]
description = "Check C# formatting, and lint the shell scripts and GitHub workflows"
run = [
  "dotnet format Jellyfin.Plugin.EmbyAuth.slnx --verify-no-changes",
  "shellcheck -x e2e/*.bash e2e/*.bats scripts/*.sh tests/scripts/*.bats",
  "shfmt -d e2e scripts tests/scripts",
  "actionlint",
  "zizmor --offline .github/workflows",
]

[tasks.test]
description = "Build with warnings as errors, then run the unit tests and the script tests"
run = [
  "dotnet test --solution Jellyfin.Plugin.EmbyAuth.slnx",
  "bats tests/scripts",
]

[tasks.package]
description = "Build the release zip and the plugin repository manifest in artifacts/release"
run = "scripts/package.sh build"

[tasks.e2e]
description = "Run the end-to-end tests against Emby and Jellyfin containers (needs Docker)"
run = "bats e2e"
