<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Emby Auth</title>
</head>
<body>
    <div id="EmbyAuthConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <form id="EmbyAuthConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="EmbyServerUrl">Emby server URL</label>
                        <input id="EmbyServerUrl" name="EmbyServerUrl" type="url" is="emby-input" placeholder="http://emby:8096" />
                        <div class="fieldDescription">The plugin sends the user name and password of each Emby login method login to this server. Use https, or an address on a private network.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var EmbyAuthConfig = {
                pluginUniqueId: 'e973e09a-e8b4-40c1-9be2-8e51342de1f9'
            };

            document.querySelector('#EmbyAuthConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(EmbyAuthConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#EmbyServerUrl').value = config.EmbyServerUrl;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#EmbyAuthConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(EmbyAuthConfig.pluginUniqueId).then(function (config) {
                        config.EmbyServerUrl = document.querySelector('#EmbyServerUrl').value;
                        ApiClient.updatePluginConfiguration(EmbyAuthConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
