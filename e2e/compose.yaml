name: emby-auth-e2e

services:
  emby:
    image: emby/embyserver:4.10.0.40
    ports:
      - "127.0.0.1:${EMBY_PORT:-18096}:8096"

  # Jellyfin reaches Emby through this proxy, which logs each request body.
  emby-proxy:
    image: nginx:1.30.5-alpine
    depends_on:
      - emby
    volumes:
      - ./emby-proxy.conf:/etc/nginx/nginx.conf:ro

  jellyfin:
    image: jellyfin/jellyfin:12.1.20260915-010956
    environment:
      # Debug level, so that the log test also sees the exceptions that Jellyfin logs for a refused login.
      JELLYFIN_Serilog__MinimumLevel__Default: Debug
    ports:
      - "127.0.0.1:${JELLYFIN_PORT:-28096}:8096"
    volumes:
      - ../artifacts/plugin:/config/plugins/EmbyAuth_0.9.0.0
      # A second real login method for the migration hand-over test. scripts/fetch-jellyfinsecurity.sh
      # fetches and checksum-verifies it before the stack comes up, so Jellyfin loads it at start.
      - ../artifacts/jellyfinsecurity/TwoFactorAuth:/config/plugins/JellyfinSecurity_2.6.1.1

  # Serves the merged catalog manifest and its zips. Behind the `catalog` profile: only
  # 85-catalog-install.bats starts it, so docker compose up -d (setup_suite.bash, dev-env.sh)
  # never starts it. nginx's default MIME table maps .json to application/json, which is what
  # Jellyfin's GetFromJsonAsync requires, so no custom configuration is needed.
  catalog-manifest:
    image: nginx:1.30.5-alpine
    profiles: ["catalog"]
    volumes:
      - ../artifacts/catalog:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${CATALOG_MANIFEST_PORT:-38080}:80"

  # A clean Jellyfin server for the catalog install/update test. Behind the `catalog` profile,
  # same as catalog-manifest. Deliberately has no volumes: the `jellyfin` service above
  # bind-mounts a directory onto /config/plugins/EmbyAuth_0.9.0.0, and a catalog install writes
  # into /config/plugins/ itself, so this service must start with nothing already installed.
  # Do not add a plugin bind mount to this service.
  catalog-jellyfin:
    image: jellyfin/jellyfin:12.1.20260915-010956
    profiles: ["catalog"]
    ports:
      - "127.0.0.1:${CATALOG_JELLYFIN_PORT:-38096}:8096"
