events {}

http {
    # Test only: log each request with its body, so that the tests can check which logins reach Emby.
    log_format requests escape=json '$request_method $uri $request_body';

    server {
        listen 8096;
        access_log /dev/stdout requests;
        client_body_buffer_size 64k;

        location / {
            proxy_pass http://emby:8096;
        }
    }
}
