repos:
-   repo: local
    hooks:
    -   id: lint
        name: mise run lint (dotnet format, shellcheck, shfmt, actionlint, zizmor)
        entry: mise run lint
        language: system
        pass_filenames: false
        files: \.(cs|csproj|slnx|props|bash|bats|ya?ml)$|^\.mise\.toml$
    -   id: test
        name: mise run test (build with warnings as errors, unit tests)
        entry: mise run test
        language: system
        pass_filenames: false
        files: \.(cs|csproj|slnx|props|html)$|^global\.json$|^\.mise\.toml$
